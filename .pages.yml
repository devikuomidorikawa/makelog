                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "description": "YYYY-MM-DD形式"
                    },
                    {
                      "name": "tags",
                      "label": "タグ",
                      "type": "reference",
                      "options": {
                        "collection": "tags",
                        "multiple": true,
                        "min": 0,
                        "max": 8,
                        "search": "name",
                        "value": "{fields.id}",
                        "label": "{fields.name}",
