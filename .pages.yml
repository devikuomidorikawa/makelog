{
  "content": [
    {
      "name": "articles",
      "label": "記事一覧",
      "type": "collection",
      "path": "src/content/articles",
      "format": "json",
      "filename": {
        "template": "{fields.id}.json",
        "field": false
      },
      "subfolders": false,
      "operations": {
        "create": true,
        "rename": false,
        "delete": false
      },
      "view": {
        "primary": "titleJa",
        "fields": [
          "titleJa",
          "date",
          "status",
          "project",
          "translationStatus"
        ],
        "search": [
          "titleJa",
          "id",
          "summaryJa",
          "project"
        ],
        "sort": [
          "date",
          "titleJa",
          "status"
        ],
        "default": {
          "sort": "date",
          "order": "desc"
        }
      },
      "fields": [
        {
          "name": "titleJa",
          "label": "記事タイトル（日本語）",
          "type": "string",
          "options": {
            "maxlength": 200
          },
          "required": true,
          "default": "無題の制作ノート",
          "pattern": {
            "regex": "\\S",
            "message": "タイトルを入力してください。下書きは仮のタイトルで保存できます。"
          }
        },
        {
          "name": "summaryJa",
          "label": "概要（日本語）",
          "type": "text",
          "options": {
            "maxlength": 1000
          },
          "description": "一覧に出る短い紹介。何が分かる記事かを1〜2文で。"
        },
        {
          "name": "bodyJa",
          "label": "本文（日本語）",
          "type": "text",
          "options": {
            "maxlength": 20000
          },
          "default": "## 課題\n\n解決したいことを書きます。\n\n## 設計思想\n\n選んだ方法と、その理由を書きます。\n\n## 使い方・確かめたこと\n\n実際にできることと、確認した内容を書きます。",
          "description": "見出しは ##、太字は **文字**、箇条書きは - 。本文は公開時に必須、下書きでは空欄にできます。画像は次の欄で追加します。"
        },
        {
          "name": "images",
          "label": "記事の画像（任意）",
          "type": "object",
          "list": {
            "max": 8,
            "collapsible": {
              "collapsed": true,
              "summary": "{altJa}"
            }
          },
          "fields": [
            {
              "name": "src",
              "label": "画像",
              "type": "image",
              "required": true,
              "options": {
                "media": "article-images",
                "extensions": [
                  "png",
                  "jpg",
                  "jpeg",
                  "webp",
                  "gif",
                  "avif"
                ],
                "rename": "random"
              }
            },
            {
              "name": "altJa",
              "label": "画像の内容（日本語・必須）",
              "type": "string",
              "required": true,
              "options": {
                "maxlength": 300
              }
            },
            {
              "name": "captionJa",
              "label": "説明（日本語）",
              "type": "text",
              "options": {
                "maxlength": 500
              }
            },
            {
              "name": "altEn",
              "label": "画像の内容（英語）",
              "type": "string",
              "options": {
                "maxlength": 300
              }
            },
            {
              "name": "captionEn",
              "label": "説明（英語）",
              "type": "text",
              "options": {
                "maxlength": 500
              }
            }
          ]
        },
        {
          "name": "project",
          "label": "関連する作品（任意）",
          "type": "reference",
          "options": {
            "collection": "projects",
            "search": "name",
            "value": "{fields.id}",
            "label": "{fields.name}",
            "placeholder": "作品名で選択"
          }
        },
        {
          "name": "tags",
          "label": "タグ",
          "type": "reference",
          "options": {
            "collection": "tags",
            "multiple": true,
            "min": 0,
            "max": 8,
            "search": "name",
            "value": "{fields.id}",
            "label": "{fields.name}",
            "placeholder": "タグを選択"
          }
        },
        {
          "name": "id",
          "label": "記事URLのID（初回のみ設定）",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "^[a-z0-9][a-z0-9-]{0,63}$",
            "message": "半角小文字英数字とハイフンで64文字以内。先頭は英数字にしてください。"
          },
          "description": "新規記事だけ設定。例 nest-usage。登録後は変更せず、別の記事と重複させないでください。",
          "options": {
            "maxlength": 64
          }
        },
        {
          "name": "date",
          "label": "公開日",
          "type": "date",
          "required": true,
          "options": {
            "format": "yyyy-MM-dd"
          }
        },
        {
          "name": "updatedAt",
          "label": "更新日（修正したとき）",
          "type": "date",
          "default": "",
          "options": {
            "format": "yyyy-MM-dd"
          }
        },
        {
          "name": "status",
          "label": "公開設定",
          "type": "select",
          "required": true,
          "options": {
            "values": [
              {
                "name": "draft",
                "label": "下書き（サイトには出さない）"
              },
              {
                "name": "published",
                "label": "公開する（保存後に検査・反映）"
              }
            ]
          },
          "default": "draft",
          "description": "公開前にタイトル・本文・公開日・画像の説明を確認。Saveは原稿の保存です。運営者向け編集の「公開状況」で反映完了を確認できます。"
        },
        {
          "name": "translationStatus",
          "label": "英訳の状態",
          "type": "select",
          "default": "missing",
          "options": {
            "values": [
              {
                "name": "missing",
                "label": "未作成"
              },
              {
                "name": "needs-update",
                "label": "日本語を更新・英訳要更新"
              },
              {
                "name": "current",
                "label": "対応済み"
              }
            ]
          },
          "description": "日本語を直したら「英訳要更新」。英訳がなければ「未作成」。"
        },
        {
          "name": "titleEn",
          "label": "記事タイトル（英語）",
          "type": "string",
          "options": {
            "maxlength": 200
          }
        },
        {
          "name": "summaryEn",
          "label": "概要（英語）",
          "type": "text",
          "options": {
            "maxlength": 1000
          }
        },
        {
          "name": "bodyEn",
          "label": "本文（英語）",
          "type": "text",
          "options": {
            "maxlength": 20000
          },
          "description": "英語が空欄なら日本語を表示します。書式と画像の扱いは日本語と同じです。"
        }
      ]
    },
    {
      "name": "projects",
      "label": "作品一覧",
      "type": "collection",
      "path": "src/content/projects",
      "format": "json",
      "filename": {
        "template": "{fields.id}.json",
        "field": false
      },
      "subfolders": false,
      "operations": {
        "create": true,
        "rename": false,
        "delete": false
      },
      "view": {
        "primary": "name",
        "fields": [
          "name",
          "updatedAt",
          "status"
        ],
        "search": [
          "name",
          "id"
        ],
        "sort": [
          "updatedAt",
          "name",
          "status"
        ],
        "default": {
          "sort": "updatedAt",
          "order": "desc"
        }
      },
      "fields": [
        {
          "name": "id",
          "label": "作品ID（登録後は変更しない）",
          "type": "string",
          "required": true,
          "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
          "description": "URLに使う半角英数字・ハイフン。既存の作品IDと重複させないでください。"
        },
        {
          "name": "name",
          "label": "作品名",
          "type": "string",
          "required": true,
          "options": {
            "maxlength": 60
          }
        },
        {
          "name": "status",
          "label": "表示状態",
          "type": "select",
          "default": "draft",
          "required": true,
          "options": {
            "values": [
              {
                "name": "draft",
                "label": "下書き"
              },
              {
                "name": "published",
                "label": "サイトに表示"
              }
            ]
          }
        },
        {
          "name": "updatedAt",
          "label": "更新日（ホームの新しい順に使用）",
          "type": "date",
          "description": "YYYY-MM-DD形式",
          "required": true,
          "options": {
            "format": "yyyy-MM-dd"
          }
        },
        {
          "name": "tags",
          "label": "タグ",
          "type": "reference",
          "options": {
            "collection": "tags",
            "multiple": true,
            "min": 0,
            "max": 8,
            "search": "name",
            "value": "{fields.id}",
            "label": "{fields.name}",
            "placeholder": "タグを選択"
          }
        },
        {
          "name": "category",
          "label": "カテゴリ（1:日本語 / 2:英語）",
          "type": "text",
          "list": {
            "min": 2,
            "max": 2
          },
          "options": {
            "maxlength": 160
          }
        },
        {
          "name": "title",
          "label": "見出し（1:日本語 / 2:英語）",
          "type": "text",
          "list": {
            "min": 2,
            "max": 2
          },
          "options": {
            "maxlength": 200
          }
        },
        {
          "name": "short",
          "label": "短い紹介（1:日本語 / 2:英語）",
          "type": "text",
          "list": {
            "min": 2,
            "max": 2
          },
          "options": {
            "maxlength": 200
          }
        },
        {
          "name": "description",
          "label": "作品の説明（1:日本語 / 2:英語）",
          "type": "text",
          "list": {
            "min": 2,
            "max": 2
          },
          "options": {
            "maxlength": 3000
          }
        },
        {
          "name": "tech",
          "label": "技術構成",
          "type": "string",
          "list": {
            "min": 1,
            "max": 12
          },
          "options": {
            "maxlength": 160
          }
        },
        {
          "name": "flow",
          "label": "処理の流れ",
          "type": "string",
          "list": {
            "min": 1,
            "max": 6
          },
          "options": {
            "maxlength": 160
          }
        },
        {
          "name": "demoUrl",
          "label": "アプリ・デモのURL（任意）",
          "type": "string",
          "pattern": "^https://",
          "description": "公開してよいHTTPSのURLだけ。入力がなければ紹介ページのみ表示します。"
        },
        {
          "name": "repository",
          "label": "GitHub（任意）",
          "type": "string",
          "description": "owner/repository形式。非公開リポジトリは登録しないでください。"
        },
        {
          "name": "download",
          "label": "ZIPダウンロード（任意）",
          "type": "object",
          "description": "公開済みGitHub Releasesを案内します。利用する場合はGitHub欄と以下の全項目を入力。解除はこの設定全体を空にします。英語も必須です。",
          "fields": [
            {
              "name": "tag",
              "label": "公開リリースのタグ",
              "type": "string",
              "required": true,
              "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$",
              "options": {
                "maxlength": 64
              }
            },
            {
              "name": "file",
              "label": "配布ZIPのファイル名",
              "type": "string",
              "required": true,
              "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,155}\\.[zZ][iI][pP]$",
              "options": {
                "maxlength": 160
              }
            },
            {
              "name": "label",
              "label": "ダウンロードボタン（1:日本語 / 2:英語）",
              "type": "text",
              "required": true,
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 200
              }
            },
            {
              "name": "requirements",
              "label": "動作環境・料金（1:日本語 / 2:英語）",
              "type": "text",
              "required": true,
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 300
              }
            },
            {
              "name": "notice",
              "label": "利用前の注意（1:日本語 / 2:英語）",
              "type": "text",
              "required": true,
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 500
              }
            },
            {
              "name": "instructions",
              "label": "ダウンロード後の手順（1:日本語 / 2:英語）",
              "type": "text",
              "required": true,
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 1500
              }
            }
          ]
        },
        {
          "name": "image",
          "label": "作品画像（任意）",
          "type": "image",
          "options": {
            "media": "article-images",
            "extensions": [
              "png",
              "jpg",
              "jpeg",
              "webp",
              "gif",
              "avif"
            ],
            "rename": "random"
          },
          "description": "公開可能な実画面を選択。個人情報や実ファイル名はダミーに置き換えてください。"
        }
      ]
    },
    {
      "name": "makelog",
      "label": "サイト設定",
      "type": "file",
      "path": "src/content/site.json",
      "format": "json",
      "fields": [
        {
          "name": "version",
          "label": "データの版",
          "type": "number",
          "readonly": true
        },
        {
          "name": "site",
          "label": "サイトの文章・配色",
          "type": "object",
          "fields": [
            {
              "name": "brand",
              "label": "ブランド名",
              "type": "string",
              "required": true,
              "options": {
                "maxlength": 60
              }
            },
            {
              "name": "tagline",
              "label": "ブランドの肩書き",
              "type": "string",
              "required": true,
              "options": {
                "maxlength": 100
              }
            },
            {
              "name": "featuredProject",
              "label": "ホームの注目作品",
              "type": "reference",
              "options": {
                "collection": "projects",
                "search": "name",
                "value": "{fields.id}",
                "label": "{fields.name}",
                "placeholder": "作品名で選択"
              },
              "required": true,
              "default": "atlas"
            },
            {
              "name": "heroTitle",
              "label": "トップページの見出し（1:日本語 / 2:英語）",
              "type": "text",
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 200
              }
            },
            {
              "name": "heroDescription",
              "label": "トップページの説明（1:日本語 / 2:英語）",
              "type": "text",
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 3000
              }
            },
            {
              "name": "studioBody",
              "label": "スタジオのメッセージ（1:日本語 / 2:英語）",
              "type": "text",
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 3000
              }
            },
            {
              "name": "studioNote",
              "label": "短いメッセージ（1:日本語 / 2:英語）",
              "type": "text",
              "list": {
                "min": 0,
                "max": 2
              },
              "options": {
                "maxlength": 3000
              },
              "hidden": true
            },
            {
              "name": "footer",
              "label": "フッターの文章（1:日本語 / 2:英語）",
              "type": "text",
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 3000
              }
            },
            {
              "name": "about",
              "label": "ブランドについて（1:日本語 / 2:英語）",
              "type": "text",
              "list": {
                "min": 2,
                "max": 2
              },
              "options": {
                "maxlength": 3000
              }
            },
            {
              "name": "colors",
              "label": "配色",
              "type": "object",
              "fields": [
                {
                  "name": "canvas",
                  "label": "ページの背景",
                  "type": "string",
                  "required": true,
                  "pattern": "^#[a-fA-F0-9]{6}$"
                },
                {
                  "name": "surface",
                  "label": "入力欄の背景",
                  "type": "string",
                  "required": true,
                  "pattern": "^#[a-fA-F0-9]{6}$"
                },
                {
                  "name": "stone",
                  "label": "作品パネルの背景",
                  "type": "string",
                  "required": true,
                  "pattern": "^#[a-fA-F0-9]{6}$"
                },
                {
                  "name": "ink",
                  "label": "文字の色",
                  "type": "string",
                  "required": true,
                  "pattern": "^#[a-fA-F0-9]{6}$"
                },
                {
                  "name": "accent",
                  "label": "ポイントの色",
                  "type": "string",
                  "required": true,
                  "pattern": "^#[a-fA-F0-9]{6}$"
                }
              ],
              "description": "文字と背景のコントラストが不足すると公開用ビルドで停止します。"
            }
          ]
        },
        {
          "name": "pages",
          "label": "サイトの案内ページ",
          "type": "object",
          "list": {
            "min": 0,
            "max": 3,
            "collapsible": {
              "collapsed": true,
              "summary": "{titleJa} / {id}"
            }
          },
          "fields": [
            {
              "name": "id",
              "label": "ページの種類（登録後は変更しない）",
              "type": "select",
              "required": true,
              "options": {
                "values": [
                  {
                    "name": "privacy",
                    "label": "プライバシー"
                  },
                  {
                    "name": "guide",
                    "label": "サイトの使い方"
                  },
                  {
                    "name": "contact",
                    "label": "お問い合わせ"
                  }
                ]
              }
            },
            {
              "name": "titleJa",
              "label": "タイトル（日本語）",
              "type": "string",
              "required": true,
              "options": {
                "maxlength": 200
              }
            },
            {
              "name": "titleEn",
              "label": "タイトル（英語）",
              "type": "string",
              "options": {
                "maxlength": 200
              }
            },
            {
              "name": "bodyJa",
              "label": "本文（日本語）",
              "type": "text",
              "required": true,
              "options": {
                "maxlength": 10000
              }
            },
            {
              "name": "bodyEn",
              "label": "本文（英語）",
              "type": "text",
              "options": {
                "maxlength": 10000
              }
            }
          ]
        }
      ],
      "operations": {
        "delete": false,
        "rename": false
      }
    },
    {
      "name": "tags",
      "label": "タグ管理",
      "type": "collection",
      "path": "src/content/tags",
      "format": "json",
      "filename": {
        "template": "{fields.id}.json",
        "field": false
      },
      "operations": {
        "create": true,
        "rename": false,
        "delete": false
      },
      "view": {
        "primary": "name",
        "fields": [
          "name",
          "mergeInto"
        ],
        "search": [
          "name"
        ],
        "sort": [
          "name"
        ],
        "default": {
          "sort": "name",
          "order": "asc"
        }
      },
      "fields": [
        {
          "name": "id",
          "label": "管理ID",
          "type": "uuid",
          "required": true,
          "readonly": true,
          "hidden": true,
          "options": {
            "editable": false,
            "generate": false
          }
        },
        {
          "name": "legacyId",
          "label": "旧データとの互換ID",
          "type": "string",
          "readonly": true,
          "hidden": true
        },
        {
          "name": "name",
          "label": "タグ名",
          "type": "string",
          "required": true,
          "options": {
            "maxlength": 32
          },
          "description": "名前の変更は全作品・記事へ反映されます。"
        },
        {
          "name": "mergeInto",
          "label": "統合先",
          "type": "reference",
          "options": {
            "collection": "tags",
            "search": "name",
            "value": "{fields.id}",
            "label": "{fields.name}",
            "placeholder": "統合しない／タグ名で検索"
          },
          "description": "統合するときだけ選択。解除すると元のタグに戻ります。"
        }
      ]
    }
  ],
  "media": [
    {
      "name": "article-images",
      "label": "記事・作品の画像",
      "input": "public/assets/media",
      "output": "media",
      "rename": "random",
      "extensions": [
        "png",
        "jpg",
        "jpeg",
        "webp",
        "gif",
        "avif"
      ]
    }
  ]
}
